[project]
name = "tb-detection-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RITESH-del", email = "riteshrishu2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "typer>=0.15",
]

[project.scripts]
tb-detection-model = "tb_detection_model:main"


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=8.0",
    "flake8>=7.0",
]
