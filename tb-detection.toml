# TB Detection Model experiment configuration.
# Relative paths are resolved from this file's directory.

[dataset]
input_dir = "data/raw"
output_dir = "data/processed"
seed = 42
target_size = [518, 518]
manifest_filename = "manifest.csv"
archive_glob = "*.zip"
train_archives = []
validation_archives = []
test_archives = []

[dataset.split_ratios]
train = 0.70
val = 0.15
test = 0.15

[preprocessing]
minimum_image_size = [50, 50]
minimum_image_mean = 5.0
roi_mode = "anatomical"
roi_height_fraction = [0.02, 0.98]
roi_width_fraction = [0.02, 0.98]
median_blur_kernel = 0
bilateral_filter = true
clahe_clip_limit = 1.5
clahe_tile_grid_size = [16, 16]

[logging]
level = "INFO"
scan_log_interval = 1000
process_log_interval = 100

[model]
name = "facebook/dinov2-small"
data_dir = "data/processed"
output_dir = "models/dinov2"
report_dir = "reports"
epochs = 5
batch_size = 32
learning_rate = 0.0001
freeze_backbone = false
train_top_k = 2
patience = 3
auto_class_weights = false
device = "auto"
seed = 42
num_workers = 2
dual_representation = true
